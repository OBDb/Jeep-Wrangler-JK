generations:
  - name: "First Generation (JK) - Phase 1"
    start_year: 2007
    end_year: 2011
    description: "The Jeep Wrangler JK Phase 1 (2007-2011) represents the initial production run of the third-generation Wrangler, introducing significant advancements over the previous TJ generation. This iteration marked the first use of a 3.8L EGH V6 engine producing 202 horsepower and 237 lb-ft of torque, paired with either a six-speed Chrysler NSG370 manual or four-speed 42RLE automatic transmission. The JK introduced the four-door Wrangler Unlimited with a 20.6-inch wheelbase stretch, dramatically expanding practicality while maintaining authentic off-road capability. Built on an all-new platform with a wider track and increased dimensions, it featured body-on-frame construction with rigid live axles front and rear. Standard features included off-road tuned ABS, traction control, and electronic limited-slip differential, with Rubicon models receiving electronic sway bar disconnect. Trim levels included Sport (X), Sahara, and Rubicon, with the Rubicon offering Dana 44 axles, Tru-Lok locking differentials, and Rock-Trac transfer case with 4:1 low range. The Phase 1 models represent the foundational JK design before the significant 2011 interior refresh and 2012 powertrain upgrade."

  - name: "First Generation (JK) - Phase 2"
    start_year: 2011
    end_year: 2012
    description: "The Jeep Wrangler JK Phase 2 (2011-2012) represents the mid-cycle interior refresh while retaining the original 3.8L V6 powertrain. The 2011 model year brought a comprehensive interior redesign including a new steering wheel with integrated Bluetooth voice command, cruise control, and audio system controls. The Uconnect hands-free Bluetooth phone system with voice control became available, along with Garmin-based GPS navigation and SiriusXM Satellite Radio. Interior updates included new door skins, power window control switch panel, climate controls and vents, and improved seat fabrics with optional heated front seats and leather-trimmed seating for the first time. New aluminum-alloy wheel options were introduced, and both the automatic transmission shift lever and manual four-wheel-drive system shifter were redesigned. Despite these significant interior changes, the 3.8L V6 and four-speed automatic remained in place until the 2012 model year when the Pentastar engine arrived. The Phase 2 represents a transitional period between the original JK design and the more refined later models."

  - name: "First Generation (JK) - Phase 3"
    start_year: 2012
    end_year: 2018
    description: "The Jeep Wrangler JK Phase 3 (2012-2018) represents the most refined and capable version of the JK generation, featuring the upgraded 3.6L Pentastar VVT V6 engine producing 285 horsepower and 260 lb-ft of torque. This engine replaced the 3.8L V6 and was paired with either the six-speed NSG370 manual or five-speed Mercedes-Benz W5A580 automatic transmission, significantly improving both performance and fuel efficiency. The Phase 3 also included exterior updates such as the 2014 refresh with clear park lamps and turn signal indicators replacing amber units, along with six new body colors. Special editions during this period included the Arctic, Call of Duty: MW3, Moab, Overland, Rubicon X, Dragon, Polar, Freedom, Golden Eagle, and 75th Anniversary Edition. The interior continued to receive updates including the available UConnect 6.5-inch touchscreen radio with hard drive storage. Production continued alongside the new JL generation for part of 2018, with JK models distinguished by front fender badging. Production ended April 27, 2018, after twelve years of JK production, marking the conclusion of one of the most successful Wrangler generations in terms of sales and mainstream appeal."